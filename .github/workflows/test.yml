name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make test
      - run: make build

  migration-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.13
          cache-dependency-path: go.sum
      - run: make test-compatibility PKG_COMPAT_VERSION=v0.5.0

  template-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.13
          cache-dependency-path: go.sum
      - name: Install generation tools
        run: |
          make protoc
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v2.29.0
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@v2.29.0
      - name: Install protobuf include sources
        run: |
          mkdir -p "$(go env GOPATH)/src/github.com/grpc-kit"
          mkdir -p "$(go env GOPATH)/src/github.com/googleapis"
          mkdir -p "$(go env GOPATH)/src/github.com/grpc-ecosystem"
          git clone --branch v0.3.1 --depth 1 https://github.com/grpc-kit/api.git "$(go env GOPATH)/src/github.com/grpc-kit/api"
          git init "$(go env GOPATH)/src/github.com/googleapis/googleapis"
          git -C "$(go env GOPATH)/src/github.com/googleapis/googleapis" remote add origin https://github.com/googleapis/googleapis.git
          git -C "$(go env GOPATH)/src/github.com/googleapis/googleapis" fetch --depth 1 origin e0d0106516a5c613510533821e4508bc6c943b11
          git -C "$(go env GOPATH)/src/github.com/googleapis/googleapis" checkout --detach FETCH_HEAD
          git clone --branch v2.29.0 --depth 1 https://github.com/grpc-ecosystem/grpc-gateway.git "$(go env GOPATH)/src/github.com/grpc-ecosystem/grpc-gateway"
      - run: make test-template-compatibility
